<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="monadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D8DF1"/>
      <stop offset="100%" stop-color="#836EF9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#836EF9" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#09080F"/>
  <!-- Hexagonal Aperture Lens Petals -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- 6 angled petals revolving 60 degrees around center -->
    <path d="M 0 -36 L 24 -22 L 15 -7 L -9 -21 Z" fill="#A78BFA" opacity="0.95"/>
    <path d="M 24 -22 L 36 0 L 21 9 L 9 -13 Z" fill="#9079FA" opacity="0.95"/>
    <path d="M 36 0 L 12 36 L -3 21 L 21 0 Z" fill="#836EF9" opacity="0.95"/>
    <path d="M 12 36 L -24 22 L -15 7 L 9 21 Z" fill="#755FE6" opacity="0.95"/>
    <path d="M -24 22 L -36 0 L -21 -9 L -9 13 Z" fill="#6E56CF" opacity="0.95"/>
    <path d="M -36 0 L -12 -36 L 3 -21 L -21 0 Z" fill="#8B75F5" opacity="0.95"/>
    <!-- Center aperture opening ring -->
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#09080F" stroke="#836EF9" stroke-width="1.5"/>
  </g>
</svg>
